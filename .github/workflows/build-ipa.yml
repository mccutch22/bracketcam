# Builds an unsigned BracketCam.ipa on GitHub's free macOS runners.
# Download it from the run's "Artifacts" section, then install with
# Sideloadly or AltStore on Windows (see SETUP.md).
name: Build IPA

on:
  push:
    branches: [main, "codex/**"]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Check bracket exposure ladders
        run: |
          swiftc -parse-as-library Sources/BracketPlanner.swift Tests/BracketPlannerChecks.swift -o "$RUNNER_TEMP/bracket-planner-checks"
          "$RUNNER_TEMP/bracket-planner-checks"

      - name: Check shutter preparation timing
        run: |
          swiftc -parse-as-library Sources/CapturePreparation.swift Tests/CapturePreparationChecks.swift -o "$RUNNER_TEMP/capture-preparation-checks"
          "$RUNNER_TEMP/capture-preparation-checks"

      - name: Check address search
        run: |
          swiftc -parse-as-library Sources/AddressSearchModel.swift Tests/AddressSearchChecks.swift -o "$RUNNER_TEMP/address-search-checks"
          "$RUNNER_TEMP/address-search-checks"

      - name: Check private bracket storage
        run: |
          swiftc -parse-as-library Sources/BracketStore.swift Tests/BracketStoreChecks.swift -o "$RUNNER_TEMP/bracket-store-checks"
          "$RUNNER_TEMP/bracket-store-checks"

      - name: Check processing provider journal compatibility
        run: |
          swiftc -parse-as-library Sources/SavedUpload.swift Tests/SavedUploadChecks.swift -o "$RUNNER_TEMP/saved-upload-checks"
          "$RUNNER_TEMP/saved-upload-checks"

      - name: Check tutorial onboarding and bundled video
        run: |
          swiftc -parse-as-library Sources/TutorialOnboarding.swift Tests/TutorialOnboardingChecks.swift -o "$RUNNER_TEMP/tutorial-checks"
          "$RUNNER_TEMP/tutorial-checks"
          test -s Sources/Resources/CameraTutorial.mp4
          test -s Sources/Assets.xcassets/TutorialPoster.imageset/tutorial.jpg

      - name: Check capture diagnostics
        run: |
          swiftc -parse-as-library Sources/BracketStore.swift Sources/CaptureDiagnostics.swift Tests/CaptureDiagnosticsChecks.swift -o "$RUNNER_TEMP/capture-diagnostics-checks"
          "$RUNNER_TEMP/capture-diagnostics-checks"

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned, Release, device)
        run: |
          xcodebuild \
            -project BracketCam.xcodeproj \
            -scheme BracketCam \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Verify tutorial is in the built app
        run: test -s "build/Build/Products/Release-iphoneos/BracketCam.app/CameraTutorial.mp4"

      - name: Package .ipa
        run: |
          mkdir -p Payload
          cp -R "build/Build/Products/Release-iphoneos/BracketCam.app" Payload/
          zip -qry BracketCam.ipa Payload

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BracketCam-ipa
          path: BracketCam.ipa
          retention-days: 30
