# XcodeGen spec — the GitHub Actions workflow runs `xcodegen generate` to turn
# this into BracketCam.xcodeproj, so no Mac/Xcode is needed to author the project.
name: BracketCam
options:
  bundleIdPrefix: com.jeffm
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  BracketCam:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Sources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: PhotoDash
        CFBundleShortVersionString: "2.1"
        CFBundleVersion: "2"
        CFBundleURLTypes:
          - CFBundleURLName: com.photodash.app.authentication
            CFBundleURLSchemes:
              - com.photodash.app
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiredDeviceCapabilities:
          - arm64
        ITSAppUsesNonExemptEncryption: false
        CFBundleIconName: AppIcon
        NSCameraUsageDescription: Photo Dash uses the camera to shoot HDR exposure brackets.
        NSPhotoLibraryUsageDescription: PhotoDash can show older bracket stacks previously saved in Photos. New captures stay inside the app.
        NSPhotoLibraryAddUsageDescription: PhotoDash saves finished photos to your camera roll when you tap Download.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.photodash.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"          # iPhone only
        SWIFT_VERSION: "5.9"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        # The CI build is unsigned; Sideloadly/AltStore re-sign on install.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
